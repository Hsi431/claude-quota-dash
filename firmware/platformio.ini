[env:tdisplay]
platform = espressif32@6.13.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	; TFT_eSPI is configured entirely from here so the library stays pristine.
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DINIT_SEQUENCE_3=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DCGRAM_OFFSET=1
	-DTFT_INVERSION_ON=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_PARALLEL_8_BIT=1
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_CS=6
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DSPI_FREQUENCY=27000000
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
